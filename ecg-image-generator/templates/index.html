<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECG Image Generator Pro</title>
    <!-- Use Outfit font for a premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="background-gradients">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>
    </div>

    <div class="app-container">
        <header class="header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 12H18L15 21L9 3L6 12H2" stroke="url(#paint0_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs>
                        <linearGradient id="paint0_linear" x1="2" y1="12" x2="22" y2="12" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#00F0FF"/>
                            <stop offset="1" stop-color="#7000FF"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1>ECG Image Gen <span>Pro</span></h1>
            </div>
            <div class="badge">v1.2 AI Enhanced</div>
        </header>

        <main class="main-content">
            <aside class="sidebar glass-panel">
                <div class="panel-header">
                    <h2>Configuration</h2>
                </div>
                
                <form id="configForm" class="config-form">
                    <div class="form-group">
                        <label for="inputDir">Input Directory (WFDB format)</label>
                        <input type="text" id="inputDir" name="inputDir" value="{{ default_input }}" required>
                    </div>

                    <div class="section-divider">Distortions & Augmentations</div>

                    <div class="toggle-group">
                        <label class="toggle">
                            <input type="checkbox" name="hwText">
                            <span class="slider"></span>
                            <span class="label-text">Handwritten Text</span>
                        </label>
                        <label class="toggle">
                            <input type="checkbox" name="wrinkles">
                            <span class="slider"></span>
                            <span class="label-text">Wrinkles & Creases</span>
                        </label>
                        <label class="toggle">
                            <input type="checkbox" name="augment">
                            <span class="slider"></span>
                            <span class="label-text">Noise & Rotation</span>
                        </label>
                    </div>

                    <div class="section-divider">Output Formatting</div>

                    <div class="toggle-group">
                        <label class="toggle">
                            <input type="checkbox" name="printHeader" checked>
                            <span class="slider"></span>
                            <span class="label-text">Print Header text</span>
                        </label>
                        <label class="toggle">
                            <input type="checkbox" name="addQrCode" checked>
                            <span class="slider"></span>
                            <span class="label-text">Add QR Code</span>
                        </label>
                        <label class="toggle">
                            <input type="checkbox" name="randomResolution">
                            <span class="slider"></span>
                            <span class="label-text">Random Resolution</span>
                        </label>
                        <label class="toggle">
                            <input type="checkbox" name="maskUnplotted">
                            <span class="slider"></span>
                            <span class="label-text">Mask Unplotted Samples</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-primary" id="generateBtn">
                        <span class="btn-text">Generate Image</span>
                        <div class="spinner hidden"></div>
                    </button>
                </form>
            </aside>

            <section class="preview-area glass-panel">
                <div class="panel-header">
                    <h2>Generated View</h2>
                </div>

                <div class="canvas-container" id="canvasContainer">
                    <div class="empty-state">
                        <div class="icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <p>Configure settings and click generate to see synthetic ECG outputs. <i>(Will process 1 image for preview)</i></p>
                    </div>
                    <div class="loading-state hidden">
                        <div class="pulse-ring"></div>
                        <p>Processing time-series data...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/js/main.js"></script>
</body>
</html>
